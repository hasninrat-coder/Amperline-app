
name: Build Amperline APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip amperline-app.zip -d source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: source/amperline-app
        run: npm install

      - name: Create Android project
        working-directory: source/amperline-app
        run: npx cap add android

      - name: Build APK
        working-directory: source/amperline-app
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amperline-APK
          path: source/amperline-app/android/app/build/outputs/apk/debug/app-debug.apk
